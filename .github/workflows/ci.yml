name: SynapseQ CI

on:
  push:
    branches: [master, main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [master, main, develop]

jobs:
  contracts:
    name: Smart Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Run contract tests
        run: forge test -vvv

  sdk:
    name: Post-Quantum SDK (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

  gateway:
    name: Key-Release Gateway (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            gateway/package-lock.json

      # The gateway imports SDK sources, so the SDK dependencies must be installed too
      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Install gateway dependencies
        working-directory: gateway
        run: npm ci

      - name: Typecheck, lint and test
        working-directory: gateway
        run: npm run typecheck && npm run lint && npm test

  frontend:
    name: Frontend (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            frontend/package-lock.json

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and production build
        working-directory: frontend
        run: npm run typecheck && npm run build
